_target_: tabasco.models.flow_model.FlowMatchingModel

net:
  _target_: tabasco.models.components.transformer_module.TransformerModule
  spatial_dim: ${globals.spatial_dim}
  atom_dim: ${globals.atom_dim}
  hidden_dim: 256
  num_layers: 16
  num_heads: 8
  implementation: reimplemented # pytorch
  cross_attention: true
  # --- continuous flow matching (NOT CTMC) ---
  # Consume the continuous simplex atom vector directly via nn.Linear instead of
  # argmax + nn.Embedding. Required to pair with GaussianSimplexAtomInterpolant.
  atom_input_mode: continuous_linear
  max_num_atoms: ${globals.max_num_atoms}

compile: false
interdist_loss: null
time_distribution: beta
time_alpha_factor: 1.8
num_random_augmentations: 7 # +1 (for the original sample) = 8
sample_schedule: log

coords_interpolant:
  _target_: tabasco.flow.interpolate.SDEMetricInterpolant
  key: coords
  loss_weight: 1.0
  scale_noise_by_log_num_atoms: false
  noise_scale: 1.0
  langevin_sampling_schedule:
    _target_: tabasco.sample.noise_schedule.SampleNoiseSchedule
    cutoff: 0.9
  white_noise_sampling_scale: 0.01
  time_factor:
    _target_: tabasco.flow.time_factor.InverseTimeFactor
    max_value: 100.0
    min_value: 0.05
    zero_before: 0.0
    eps: 1e-6

# --- continuous flow matching for atom types ---
# GaussianSimplexAtomInterpolant: a_t = (1-beta)*Gaussian_noise + beta*onehot,
# model output = logits -> softmax = simplex endpoint. Replaces the CTMC
# DiscreteInterpolant used by the original TABASCO teacher.
atomics_interpolant:
  _target_: tabasco.flow.interpolate.GaussianSimplexAtomInterpolant
  key: atomics
  loss_weight: 0.1
  beta_schedule: linear
  beta_power: 1.0
  time_factor:
    _target_: tabasco.flow.time_factor.InverseTimeFactor
    max_value: 100.0
    min_value: 0.05
    zero_before: 0.0
    eps: 1e-6
