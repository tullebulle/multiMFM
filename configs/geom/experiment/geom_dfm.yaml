# @package _global_

# Continuous flow-matching (DFM) base model ("teacher") on GEOM-Drugs, heavy atoms.
# This is the GEOM-Drugs column of paper Table 19; it produced
# checkpoints/geom/teacher/epoch=38-step=89310.ckpt.
#
#   python -m multimfm.geom.train_base experiment=geom_dfm trainer=gpu
#
# NOTE (batch size). The version of this file committed in the source repo said
# `batch_size: 256`, but the run that produced the released checkpoint used 512
# on a single GPU -- see the resolved run config shipped next to the checkpoint
# (checkpoints/geom/teacher/hydra/config.yaml) and docs/provenance/geom/checkpoints.md.
# 512 is set here so the file reproduces the paper run; with 7 extra rotation
# copies the effective batch is 4,096, which is the number printed in Table 19.

tags: ["geom", "dfm", "continuous", "teacher"]

seed: 42

datamodule:
  _target_: tabasco.data.lmdb_datamodule.LmdbDataModule
  data_dir: ${paths.data_dir}/geom/processed_geom_train.pt
  val_data_dir: ${paths.data_dir}/geom/processed_geom_val.pt
  test_data_dir: ${paths.data_dir}/geom/processed_geom_test.pt
  lmdb_dir: ${paths.data_dir}/geom/lmdb_geom
  add_random_rotation: true
  add_random_permutation: false
  reorder_to_smiles_order: true
  remove_hydrogens: true          # heavy-atom-only teacher (atom_dim = 9)
  batch_size: 512                 # 1 GPU; x8 rotation copies -> 4,096 effective
  num_workers: 8                  # fork-safe LMDB (per-worker handle)

model:
  net:
    atom_input_mode: continuous_linear   # continuous FM (redundant with base, kept explicit)
    hidden_dim: 256
    num_layers: 16
    num_heads: 8
  atomics_interpolant:
    _target_: tabasco.flow.interpolate.GaussianSimplexAtomInterpolant
    key: atomics
    loss_weight: 0.1
    beta_schedule: linear

callbacks:
  ema:
    _target_: tabasco.callbacks.ema.EMA
    decay: 0.999
    every_n_steps: 1
  # The released run validated with 100 samples at 100 integration steps; the
  # source repo later raised these defaults to 500 samples / 200 steps. They
  # affect validation diagnostics only, never the trained weights.
  mol_metrics:
    num_samples: 100
    num_sampling_steps: 100
  posebusters_metrics:
    num_samples: 100
    num_sampling_steps: 100
  save_mols:
    num_samples: 100
    num_sampling_steps: 100

lightning_module:
  optimizer:
    lr: 0.002
    weight_decay: 0.0
    betas: [0.9, 0.995]

trainer:
  max_steps: 200000        # step budget for the teacher run (overrides the huge max_epochs)
  check_val_every_n_epoch: 1
  gradient_clip_val: 0.5

logger:
  wandb:
    name: "geom-drug-dfm-teacher"
    project: "geom-drugs"
    offline: true
