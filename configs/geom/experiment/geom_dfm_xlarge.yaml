# @package _global_

# Continuous flow-matching (DFM) teacher on GEOM-Drugs, XLARGE architecture:
# hidden_dim / num_layers / num_heads = 512 / 14 / 8  (~52.8M params, head_dim 64).
# Same data + pipeline as geom_dfm; larger net + smaller batch (probed: batch 320
# is the H200 ceiling under budget, 384 over, 448 OOM -> use 256 for headroom).
#
#   python -m multimfm.geom.train_base experiment=geom_dfm_xlarge

tags: ["geom", "dfm", "continuous", "teacher", "xlarge-512x14x8"]

seed: 42

datamodule:
  _target_: tabasco.data.lmdb_datamodule.LmdbDataModule
  data_dir: ${paths.data_dir}/geom/processed_geom_train.pt
  val_data_dir: ${paths.data_dir}/geom/processed_geom_val.pt
  test_data_dir: ${paths.data_dir}/geom/processed_geom_test.pt
  lmdb_dir: ${paths.data_dir}/geom/lmdb_geom
  add_random_rotation: true
  add_random_permutation: false
  reorder_to_smiles_order: true
  remove_hydrogens: true          # heavy-atom-only teacher (atom_dim = 9)
  batch_size: 256                 # H200: ~90GB at 256; ceiling ~320 (384 over budget, 448 OOM)
  num_workers: 8

model:
  net:
    atom_input_mode: continuous_linear   # continuous FM
    hidden_dim: 512
    num_layers: 14
    num_heads: 8
  atomics_interpolant:
    _target_: tabasco.flow.interpolate.GaussianSimplexAtomInterpolant
    key: atomics
    loss_weight: 0.1
    beta_schedule: linear

callbacks:
  ema:
    _target_: tabasco.callbacks.ema.EMA
    decay: 0.999
    every_n_steps: 1

lightning_module:
  optimizer:
    lr: 0.001        # lower LR for the larger model + smaller batch (~sqrt-scaled from 0.002@512)

trainer:
  max_steps: 200000
  check_val_every_n_epoch: 1

logger:
  wandb:
    name: "geom-drug-dfm-xlarge"
    project: "geom-drugs"
    offline: true
